# Configuración SOLO para pruebas: base de datos H2 en memoria (modo MySQL).
# La aplicación real sigue usando MySQL (src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:urgencias_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.thymeleaf.cache=false
