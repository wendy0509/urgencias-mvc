<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario paciente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<div class="container" style="max-width:700px">
    <h2 th:text="${paciente.id == null} ? 'Registrar paciente' : 'Editar paciente'"></h2>

    <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" data-validar>
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre completo (nombres y apellidos)</label>
            <input class="form-control" th:field="*{nombre}" autocomplete="name"
                   data-requerido="El nombre es obligatorio"
                   data-solo-letras="El nombre solo debe contener letras"
                   data-max-largo="100" data-msg-max-largo="El nombre admite máximo 100 caracteres" data-contador>
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Documento</label>
            <input class="form-control" th:field="*{documento}"
                   data-requerido="El documento es obligatorio"
                   data-solo-numeros="El documento solo debe contener números"
                   data-min-largo="5" data-msg-largo="El documento debe tener entre 5 y 20 dígitos"
                   data-max-largo="20" data-msg-max-largo="El documento admite máximo 20 dígitos">
            <div class="text-danger" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Edad</label>
            <input type="text" inputmode="numeric" class="form-control" th:field="*{edad}"
                   data-requerido="La edad es obligatoria"
                   data-solo-numeros="La edad solo debe contener números"
                   data-max-digitos="3" data-msg-digitos="La edad admite máximo 3 dígitos"
                   data-min="0" data-msg-min="La edad no puede ser negativa"
                   data-max="120" data-msg-max="La edad máxima es 120">
            <div class="text-danger" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Motivo de consulta</label>
            <input class="form-control" th:field="*{motivoConsulta}"
                   data-requerido="El motivo de consulta es obligatorio"
                   data-max-largo="255" data-contador>
            <div class="text-danger" th:if="${#fields.hasErrors('motivoConsulta')}" th:errors="*{motivoConsulta}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nivel de gravedad (1 a 5)</label>
            <input type="text" inputmode="numeric" class="form-control" th:field="*{nivelGravedad}"
                   data-requerido="La gravedad es obligatoria"
                   data-solo-numeros="Solo se permiten números del 1 al 5"
                   data-max-digitos="1" data-msg-digitos="Solo se permiten números del 1 al 5"
                   data-bloquear-rango="Solo se permiten números del 1 al 5"
                   data-min="1" data-msg-min="Mínimo 1"
                   data-max="5" data-msg-max="Máximo 5">
            <div class="text-danger" th:if="${#fields.hasErrors('nivelGravedad')}" th:errors="*{nivelGravedad}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Alergias / antecedentes críticos</label>
            <input class="form-control" th:field="*{alergias}"
                   data-max-largo="255" data-contador>
            <div class="text-danger" th:if="${#fields.hasErrors('alergias')}" th:errors="*{alergias}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Médico asignado</label>
            <select class="form-select" th:field="*{medico.id}" data-requerido="Debe seleccionar un médico">
                <option value="">-- Seleccione --</option>
                <option th:each="m : ${medicos}" th:value="${m.id}"
                        th:text="${m.nombre + ' - ' + m.especialidad}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('medico')}" th:errors="*{medico}"></div>
        </div>

        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-secondary" th:href="@{/pacientes}">Cancelar</a>
    </form>
</div>
<script th:src="@{/js/validacion-formularios.js}"></script>
</body>
</html>
